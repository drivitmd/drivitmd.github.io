<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#777;padding:24px;display:flex;flex-direction:column;gap:26px}
.cover{width:1640px;height:624px;position:relative;overflow:hidden;font-family:Montserrat,'Segoe UI',sans-serif;color:#fff}
.cover .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,.52) 0%,rgba(18,14,10,.30) 42%,rgba(18,14,10,.55) 100%),radial-gradient(120% 90% at 50% 46%,rgba(18,14,10,0) 42%,rgba(18,14,10,.45) 100%)}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
/* safe centered column (mobile-crop safe) */
.in{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;padding:40px}
.bm{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.bm svg{width:46px;height:46px}
.bm b{font-weight:800;font-size:33px;letter-spacing:-.02em}
.eyb{font-family:Roboto;font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:#FFC9C9;margin-bottom:16px}
h1{font-weight:800;font-size:68px;line-height:1.0;letter-spacing:-.03em;text-shadow:0 3px 22px rgba(0,0,0,.5);max-width:16ch}
h1 em{font-style:normal;color:#FF9E9E}
.meta{font-family:Roboto;font-weight:500;font-size:26px;margin-top:20px;color:rgba(255,255,255,.94)}
.row{display:flex;align-items:center;gap:18px;margin-top:30px}
.pill{display:inline-flex;align-items:center;gap:12px;background:#D24F4F;color:#fff;border-radius:999px;padding:16px 34px;font-weight:800;font-size:28px;box-shadow:0 16px 34px -14px rgba(178,58,58,.6)}
.pill .old{font-weight:600;font-size:22px;color:#FFD3D3;text-decoration:line-through;opacity:.9}
.cta{font-family:Roboto;font-weight:600;font-size:24px;color:#fff;border-bottom:2px solid rgba(255,255,255,.6);padding-bottom:3px}
</style></head><body>

<div class="cover" id="cover">
  <img class="bg" src="ads/yoga-group.jpg" alt="" style="object-position:42% 44%">
  <div class="scrim"></div><div class="grain"></div>
  <div class="in">
    <span class="bm"><svg viewBox="0 0 100 100"><clipPath id="e1"><circle cx="50" cy="50" r="46"/></clipPath><g clip-path="url(#e1)"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="42" r="14" fill="#BC5858"/><path d="M-4 72 C16 52 30 57 50 63 C69 57 84 52 104 72 L104 104 L-4 104Z" fill="#D24F4F"/></g><circle cx="50" cy="50" r="47" fill="none" stroke="#BC5858" stroke-width="3"/></svg><b>Drivit</b></span>
    <div class="eyb">Женский психологический ретрит</div>
    <h1>Верни себе мечты, лёгкость и <em>драйв</em></h1>
    <div class="meta">19–22 августа · берег Днестра · для женщин 30–55</div>
    <div class="row">
      <span class="pill">Цена сейчас 300 € · осталось 5 из 10 мест</span>
    </div>
    <div class="row" style="margin-top:22px"><span class="cta">Заявка → drivitmd.github.io</span></div>
  </div>
</div>

</body></html>
