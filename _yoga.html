<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#777;padding:24px;display:flex;flex-wrap:wrap;gap:26px}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:Montserrat,'Segoe UI',sans-serif;color:#2A2018}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.top{position:absolute;top:56px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.top .bm{display:flex;align-items:center;gap:14px}
.top .bm svg{width:52px;height:52px}
.top .bm b{font-weight:800;font-size:36px;letter-spacing:-.02em}
.top .ey{font-family:Roboto;font-weight:600;font-size:23px;letter-spacing:.04em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:10px;background:#B23A3A;color:#fff;border-radius:999px;padding:16px 32px;font-weight:700;font-size:29px;box-shadow:0 14px 32px -14px rgba(178,58,58,.55);width:fit-content}
/* PHOTO card */
.photo{color:#fff}
.photo .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.30) 0%,rgba(20,16,12,0) 20%,rgba(20,16,12,.16) 46%,rgba(20,16,12,.82) 74%,rgba(20,16,12,.97) 100%)}
.photo .tscrim{position:absolute;top:0;left:0;right:0;height:230px;z-index:1;background:linear-gradient(180deg,rgba(20,16,12,.55),rgba(20,16,12,0))}
.photo .top .bm b,.photo .top .ey{color:#fff}
.photo .in{position:absolute;left:64px;right:64px;bottom:66px;z-index:4}
.photo .eyb{font-family:Roboto;font-weight:600;font-size:24px;letter-spacing:.05em;text-transform:uppercase;color:#FFC9C9;margin-bottom:16px}
.photo h2{font-weight:800;font-size:82px;line-height:1.0;letter-spacing:-.03em;text-shadow:0 3px 20px rgba(0,0,0,.5)}
.photo .fact{font-family:Roboto;font-weight:400;font-size:31px;line-height:1.42;margin-top:20px;color:rgba(255,255,255,.95);max-width:25ch}
</style></head><body>

<!-- ===== УТРЕННЯЯ ЙОГА ===== -->
<div class="card photo" id="post-yoga">
  <img class="bg" src="ads/yoga-group.jpg" alt="" style="object-position:41% 50%">
  <div class="tscrim"></div><div class="scrim"></div><div class="grain"></div>
  <div class="top"><span class="bm"><svg viewBox="0 0 100 100"><clipPath id="e1"><circle cx="50" cy="50" r="46"/></clipPath><g clip-path="url(#e1)"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="42" r="14" fill="#BC5858"/><path d="M-4 72 C16 52 30 57 50 63 C69 57 84 52 104 72 L104 104 L-4 104Z" fill="#D24F4F"/></g><circle cx="50" cy="50" r="47" fill="none" stroke="#BC5858" stroke-width="3"/></svg><b>Drivit</b></span><span class="ey">Утро в Drivit</span></div>
  <div class="in">
    <div class="eyb">Каждое утро ретрита</div>
    <h2>Утро начинается<br>с йоги</h2>
    <div class="fact">Мягкая практика для тела и дыхания — чтобы начать день в контакте с собой. Без уровня подготовки, просто для&nbsp;себя.</div>
    <div style="margin-top:28px"><span class="pill">19–22 августа · берег Днестра</span></div>
  </div>
</div>

</body></html>
