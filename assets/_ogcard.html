<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
.card{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Onest,sans-serif;color:#F5EFE7}
.bg{position:absolute;inset:0;background:url('place-terrace.webp') center/cover;filter:blur(3px) brightness(.55) saturate(1.05);transform:scale(1.06)}
.scrim{position:absolute;inset:0;background:linear-gradient(105deg,rgba(24,17,10,.72),rgba(24,17,10,.32) 70%)}
.in{position:absolute;inset:0;padding:70px 76px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:52px;height:52px}
.logo b{font-family:Fraunces,serif;font-weight:600;font-size:38px;letter-spacing:.5px}
.eyebrow{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:20px;color:rgba(245,239,231,.85);margin-bottom:14px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:74px;line-height:1.02;letter-spacing:-.02em;max-width:960px}
h1 em{font-style:normal;color:#C9A15C}
.meta{display:flex;gap:22px;align-items:center;margin-top:26px;font-size:24px;color:rgba(245,239,231,.92)}
.dot{width:6px;height:6px;border-radius:50%;background:#C9A15C}
.chip{display:inline-flex;align-items:center;gap:10px;margin-top:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:12px 22px;font-size:22px;width:fit-content;-webkit-backdrop-filter:blur(6px)}
.chip b{color:#fff;font-weight:700}
</style></head><body>
<div class="card">
  <div class="bg"></div><div class="scrim"></div>
  <div class="in">
    <div class="logo">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#FAF6EE"/><circle cx="50" cy="42" r="15" fill="#B99A4E"/><path d="M-4 74 C16 54 30 59 50 65 C69 59 84 54 104 74 L104 104 L-4 104Z" fill="#7D8B6A"/><path d="M2 82 C22 76 34 86 50 82 C67 78 80 86 98 82" fill="none" stroke="#E8DCC8" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="47" fill="none" stroke="#B99A4E" stroke-width="3"/></svg>
      <b>Drivit</b>
    </div>
    <div>
      <div class="eyebrow">Женский психологический ретрит · Кишинёв</div>
      <h1>Отношения со своим <em>внутренним подростком</em></h1>
      <div class="meta"><span>19–22 августа</span><i class="dot"></i><span>Вадул-луй-Водэ, берег Днестра</span><i class="dot"></i><span>14 мест</span></div>
      <div class="chip">🔥 Ранняя цена <b>250 €</b> — до 27 июля</div>
    </div>
  </div>
</div>
</body></html>
